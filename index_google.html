<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diplomat 배송정보 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
  <style>
    :root { --primary-color: #1a365d; --accent-color: #3182ce; --bg-color: #f7fafc; --text-color: #2d3748; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', sans-serif; background: var(--bg-color); color: var(--text-color); }
    
    #intro-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--primary-color); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; transition: opacity 0.8s; }
    #intro-screen h1 { color: white; font-size: 2rem; animation: fadeInUp 1s forwards 0.3s; opacity: 0; }
    .loader { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin-top: 20px; }
    
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    #main-content { display: none; max-width: 600px; margin: 0 auto; padding: 40px 20px; opacity: 0; transition: opacity 0.8s; }
    .card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .question-title { font-weight: 700; margin-bottom: 16px; line-height: 1.5; }
    .option-group { display: flex; flex-direction: column; gap: 12px; }
    .option-item { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; }
    .option-item input { width: 18px; height: 18px; }
    
    textarea { width: 100%; padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; min-height: 100px; }
    .submit-btn { width: 100%; padding: 16px; background: var(--primary-color); color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
    
    #success-screen { display: none; text-align: center; padding: 60px 20px; }
    .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
  </style>
</head>
<body>

  <div id="intro-screen">
    <h1>DIPLOMAT</h1>
    <div class="loader"></div>
    <p style="color: white; margin-top: 20px;">배송정보 시스템</p>
  </div>

  <div id="main-content">
    <header style="text-align: center; margin-bottom: 40px;">
      <h2 style="color: var(--primary-color);">배송 일정 및 환경 확인</h2>
    </header>

    <form id="delivery-form">
      <div class="card">
        <div class="question-title">배송 일정은 순차 배송이며, 사정에 의해 원하는 일정은 변동될 수 있습니다.</div>
        <label class="option-item"><input type="checkbox" required> 확인했습니다.</label>
      </div>

      <div class="card">
        <div class="question-title">원하는 배송 날짜는 언제인가요?</div>
        <div class="option-group">
          <label class="option-item"><input type="radio" name="date_type" value="언제든 가능" required> 언제든 가능, 시간상관없음</label>
          <label class="option-item"><input type="radio" name="date_type" value="오전 이른시간"> 오전 이른시간이면 언제든 가능</label>
          <label class="option-item"><input type="radio" name="date_type" value="오후 늦은시간"> 오후 늦은시간이면 언제든 가능</label>
          <label class="option-item"><input type="radio" name="date_type" value="주말만 가능"> 주말만 가능</label>
          <label class="option-item"><input type="radio" name="date_type" value="직접입력" id="custom-date-radio"> 직접입력 (달력에서 선택)</label>
          <div id="calendar-container" style="display:none; margin-top:10px;">
            <input type="text" id="date-picker" placeholder="날짜 선택 (복수 가능)" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:5px;">
          </div>
          <label class="option-item"><input type="radio" name="date_type" value="협의 필요"> 협의 필요</label>
        </div>
      </div>

      <div class="card">
        <div class="question-title">배송기사님 설치장소 이동시 계단이 있습니까?</div>
        <div class="option-group">
          <label class="option-item"><input type="radio" name="stairs" value="해당없음" required> 해당없음</label>
          <label class="option-item"><input type="radio" name="턱 (1~3칸)" value="턱 (1~3칸)"> 턱 (1~3칸)</label>
          <label class="option-item"><input type="radio" name="stairs" value="반층계단"> 반층계단</label>
          <label class="option-item"><input type="radio" name="stairs" value="계단2층"> 계단2층</label>
          <label class="option-item"><input type="radio" name="stairs" value="계단3층"> 계단3층</label>
          <label class="option-item"><input type="radio" name="stairs" value="계단4층 이상"> 계단4층 이상</label>
        </div>
      </div>

      <div class="card">
        <div class="question-title">배송 확정 안내</div>
        <p style="font-size: 0.9rem; color: #666; margin-bottom: 12px;">배송이 확정되면 1~2일전 설치기사님이 방문 시간 전화 드릴 예정입니다.</p>
        <label class="option-item"><input type="checkbox" required> 확인했습니다.</label>
      </div>

      <div class="card">
        <div class="question-title">배송시 주의 사항 (메모)</div>
        <textarea name="memo" placeholder="메모를 입력해 주세요."></textarea>
      </div>

      <button type="submit" class="submit-btn">입력 완료</button>
    </form>
  </div>

  <div id="success-screen">
    <div style="font-size: 4rem;">✅</div>
    <h2>제출 완료!</h2>
    <p style="margin-top: 16px; color: #666;">정보가 안전하게 전달되었습니다. 감사합니다.</p>
  </div>

  <div id="loading-overlay" class="loading-overlay">
    <div class="loader" style="border-top-color: var(--primary-color);"></div>
    <p style="margin-top: 15px; font-weight: bold;">정보를 저장 중입니다...</p>
  </div>

  <script>
    // 구글 앱스 스크립트 배포 후 받은 URL을 여기에 넣으세요
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSRnPZikMtHJhnkTCC15hHWWOA7xoXQ2EJ2HICOhDIotO01fFS1TFys24yZm1g_v-C/exec";

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('intro-screen').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('intro-screen').style.display = 'none';
          const main = document.getElementById('main-content');
          main.style.display = 'block';
          setTimeout(() => main.style.opacity = '1', 50);
        }, 800);
      }, 1500);
    });

    flatpickr("#date-picker", { mode: "multiple", dateFormat: "Y-m-d", locale: "ko", minDate: "today" });

    document.getElementsByName('date_type').forEach(radio => {
      radio.addEventListener('change', (e) => {
        document.getElementById('calendar-container').style.display = e.target.value === '직접입력' ? 'block' : 'none';
      });
    });

    document.getElementById('delivery-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (GOOGLE_SCRIPT_URL === "여기에_스크립트_URL을_붙여넣으세요") {
        alert("구글 스크립트 URL 설정이 필요합니다. 가이드를 확인해 주세요!");
        return;
      }

      document.getElementById('loading-overlay').style.display = 'flex';
      
      const formData = new FormData(e.target);
      const data = {
        date_type: formData.get('date_type'),
        custom_dates: document.getElementById('date-picker').value,
        stairs: formData.get('stairs'),
        memo: formData.get('memo')
      };

      try {
        // 구글 스크립트는 보안상 no-cors를 사용하거나 redirect 처리가 필요함
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // 구글 스크립트 전송을 위한 설정
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        // no-cors는 응답을 확인할 수 없으므로 성공으로 간주하고 화면 전환
        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('main-content').style.display = 'none';
        document.getElementById('success-screen').style.display = 'block';
      } catch (err) {
        document.getElementById('loading-overlay').style.display = 'none';
        alert('제출 중 오류가 발생했습니다. 다시 시도해 주세요.');
      }
    });
  </script>
</body>
</html>
